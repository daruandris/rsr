<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RSR performance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .chart-container { margin-bottom: 30px; border: 1px solid #ddd; padding: 10px; }
    </style>
</head>
<body>
    <h1>Benchmark results</h1>

    <div class="chart-container">
        <canvas id="mseChart"></canvas>
    </div>
    <div class="chart-container">
        <canvas id="timeChart"></canvas>
    </div>

    <script src="benchmark_history.js"></script>

    <script>
        if (typeof benchmarkHistory === 'undefined') {
            document.body.innerHTML += "<h2 style='color:red'>Nincs adat! Futtasd le a benchmarkot először!</h2>";
        } else {
            const data = benchmarkHistory;
            const labels = data.map((entry, index) => `Run ${index + 1}`);

            const bioMse = data.map(d => d.biology_mse || null);
            const physMse = data.map(d => d.physics_mse || null);
            const statMse = data.map(d => d.stats_mse || null);

            const bioTime = data.map(d => d.biology_time_ms || null);
            const physTime = data.map(d => d.physics_time_ms || null);
            const statTime = data.map(d => d.stats_time_ms || null);

            // MSE Grafikon
            new Chart(document.getElementById('mseChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Biológia MSE', data: bioMse, borderColor: 'green', tension: 0.1 },
                        { label: 'Fizika MSE', data: physMse, borderColor: 'blue', tension: 0.1 },
                        { label: 'Statisztika MSE', data: statMse, borderColor: 'red', tension: 0.1 }
                    ]
                },
                options: { scales: { y: { type: 'logarithmic' } } }
            });

            // Idő Grafikon
            new Chart(document.getElementById('timeChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Bio Idő', data: bioTime, borderColor: 'lightgreen', borderDash: [5, 5] },
                        { label: 'Fizika Idő', data: physTime, borderColor: 'lightblue', borderDash: [5, 5] },
                        { label: 'Stat Idő', data: statTime, borderColor: 'pink', borderDash: [5, 5] }
                    ]
                }
            });
        }
    </script>
</body>
</html>
