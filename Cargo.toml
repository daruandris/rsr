[package]
name = "rsr"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
rand = "0.10.0"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.0"
rayon = "1.11.0"
serde = {version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
wide = "1.1.1"

[build-dependencies]
cc = "1.2.56"
cmake = "0.1.57"

[dev-dependencies]
fs2 = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lints.clippy]
too_many_arguments = "allow"
suspicious_open_options = "allow"